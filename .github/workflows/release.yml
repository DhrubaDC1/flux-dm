# Unsigned release builds for all five platforms.
# Push a tag matching pubspec's version (v0.1.0) to publish a pre-release;
# run manually to get the same files as workflow artifacts only.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.8

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported runner: its glibc is the minimum users need.
          - { target: linux, os: ubuntu-22.04 }
          - { target: android, os: ubuntu-latest }
          - { target: windows, os: windows-latest }
          - { target: macos, os: macos-latest }
          - { target: ios, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Name packages
        run: |
          echo "PKG=flux-dm-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
          mkdir dist

      - name: Linux
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
          flutter build linux --release
          tar -C build/linux/x64/release --transform 's,^bundle,flux-dm,' \
            -czf "dist/$PKG-linux-x64.tar.gz" bundle

      - if: matrix.target == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Android
        if: matrix.target == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Without these secrets the APK is signed with this runner's
          # throwaway debug key, so it cannot update an earlier install.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ORG_GRADLE_PROJECT_fluxKeystore="$RUNNER_TEMP/release.jks"
            export ORG_GRADLE_PROJECT_fluxKeystorePassword="$KEYSTORE_PASSWORD"
            export ORG_GRADLE_PROJECT_fluxKeyAlias="$KEY_ALIAS"
            export ORG_GRADLE_PROJECT_fluxKeyPassword="$KEY_PASSWORD"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; APK uses a throwaway debug key"
          fi
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$PKG-android.apk"

      - name: Windows
        if: matrix.target == 'windows'
        run: |
          flutter build windows --release
          # Bundle the MSVC runtime so the app starts on PCs without it.
          cp /c/Windows/System32/{msvcp140,vcruntime140,vcruntime140_1}.dll build/windows/x64/runner/Release/
          mv build/windows/x64/runner/Release build/windows/x64/runner/flux-dm
          7z a "dist/$PKG-windows-x64.zip" ./build/windows/x64/runner/flux-dm

      - name: macOS
        if: matrix.target == 'macos'
        run: |
          flutter build macos --release
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/Flux Download Manager.app" \
            "dist/$PKG-macos.zip"

      - name: iOS
        if: matrix.target == 'ios'
        run: |
          flutter build ios --release --no-codesign
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "dist/$PKG-ios-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --prerelease --generate-notes \
            --notes "Unsigned preview builds. See [Download](https://github.com/$GITHUB_REPOSITORY#-download) for how to open them on each platform."
